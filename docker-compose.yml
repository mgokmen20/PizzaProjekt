services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pizza_db
      POSTGRES_USER: pizza_user
      POSTGRES_PASSWORD: pizza_password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pizza-network

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - pizza-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - pizza-network

volumes:
  db-data:
    name: db-data

networks:
  pizza-network:
    name: pizza-network
    driver: bridge
